<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Login Container -->
<main class="w-full max-w-[480px]">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl ambient-shadow flex flex-col gap-xl">
<!-- Header section -->
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-20 h-20 mb-md rounded-full bg-surface-container flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist vector logo for an educational institution named 'Elimu'. The logo should use deep navy blue (#1B3B5F) and stark white colors, conveying a sense of corporate professionalism, administrative clarity, and structural authority. The style is modern SaaS, avoiding playful imagery in favor of sharp geometry." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDa_YDr9-i1iP0lkgRxtKmpH-sSbOOHef_OgPmKdo-uJ9RUq7GL1qv_XBFPniBG28TR2iB25zpKNR7Tqp5a3XVCNMHZ5wEtgA36LCsyjsxmP0eoJQ5EJfpAOAyYRJEQW9Aeox6lm3rHVXDVIy7z8-PckBEqUEZRPbejYRqGlLrCRJAWYtY1UibfmcperYIPxJRw-EKm_4F1Q-XAT0kkIiY5Fkrv7BGmfzFpTbPE6_h255PQ_wkRi96I9w"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">Elimu</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Shule yako kwa urahisi</p>
</div>
<!-- Form section -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Identifiant Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">Identifiant</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="username" name="username" placeholder="Entrez votre identifiant" required="" type="text"/>
</div>
</div>
<!-- Mot de passe Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary focus:ring-2 bg-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Se souvenir de moi</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-md rounded-lg hover:bg-primary transition-colors flex items-center justify-center gap-sm mt-sm" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer text -->
<div class="text-center mt-sm">
<p class="font-label-md text-label-md text-outline">
                    © 2024 Elimu. Accès restreint au personnel autorisé.
                </p>
</div>
</div>
</main>
