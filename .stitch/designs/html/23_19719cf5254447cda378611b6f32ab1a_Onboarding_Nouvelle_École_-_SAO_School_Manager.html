<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduGestion - Inscription École</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1b3b5f",
                        "outline-variant": "#c3c6cf",
                        "surface-variant": "#e0e3e6",
                        "on-primary-container": "#88a6cf",
                        "primary": "#002547",
                        "inverse-on-surface": "#eef1f4",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#ffdcbe",
                        "on-secondary-container": "#6a3c00",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "secondary-container": "#fda13a",
                        "surface-container": "#ebeef1",
                        "on-surface": "#181c1e",
                        "on-tertiary-container": "#8aa6c7",
                        "on-secondary-fixed": "#2d1600",
                        "primary-fixed-dim": "#abc8f4",
                        "tertiary-fixed": "#d0e4ff",
                        "tertiary-fixed-dim": "#acc9eb",
                        "inverse-primary": "#abc8f4",
                        "secondary-fixed-dim": "#ffb871",
                        "secondary": "#8b5000",
                        "on-error": "#ffffff",
                        "tertiary-container": "#1e3c58",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e0e3e6",
                        "tertiary": "#032641",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f1f4f7",
                        "background": "#f7fafd",
                        "outline": "#73777f",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#2c4965",
                        "on-primary-fixed": "#001c38",
                        "surface-dim": "#d7dadd",
                        "on-primary-fixed-variant": "#2a486d",
                        "surface-container-high": "#e5e8eb",
                        "inverse-surface": "#2d3133",
                        "primary-fixed": "#d3e4ff",
                        "surface": "#f7fafd",
                        "on-secondary-fixed-variant": "#693c00",
                        "surface-tint": "#426086",
                        "on-tertiary": "#ffffff",
                        "on-background": "#181c1e",
                        "on-surface-variant": "#43474e",
                        "surface-bright": "#f7fafd",
                        "on-tertiary-fixed": "#001d34"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "20px",
                        "margin-desktop": "40px",
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "unit": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .plan-card {
            transition: all 0.2s ease-in-out;
        }
        .plan-card.active {
            border-color: #1b3b5f;
            box-shadow: 0 0 0 2px #1b3b5f;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center py-margin-desktop px-margin-mobile md:px-margin-desktop">
<!-- Header Section -->
<header class="w-full max-w-4xl text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary mb-lg">
<span class="material-symbols-outlined text-4xl" data-icon="school">school</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary mb-sm">Bienvenue sur EduGestion</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Veuillez configurer le profil de votre établissement et choisir le forfait qui correspond à vos besoins administratifs pour commencer.</p>
</header>
<!-- Main Content Container -->
<main class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg md:p-xl mb-margin-desktop">
<form action="#" class="space-y-xl" method="POST">
<!-- Step 1: School Details -->
<section>
<div class="flex items-center gap-sm mb-lg border-b border-outline-variant pb-sm">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-container text-primary font-label-md text-label-md">1</span>
<h2 class="font-headline-md text-headline-md text-primary">Informations de l'Établissement</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="schoolName">Nom de l'école</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow" id="schoolName" name="schoolName" placeholder="Ex: Collège Saint-Joseph" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="province">Province</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow" id="province" name="province">
<option disabled="" selected="" value="">Sélectionner une province</option>
<option value="kinshasa">Kinshasa</option>
<option value="haut-katanga">Haut-Katanga</option>
<option value="kongo-central">Kongo Central</option>
<option value="nord-kivu">Nord-Kivu</option>
<option value="sud-kivu">Sud-Kivu</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="city">Ville / Commune</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow" id="city" name="city" placeholder="Ex: Gombe" type="text"/>
</div>
</div>
</section>
<!-- Step 2: Director Contact -->
<section>
<div class="flex items-center gap-sm mb-lg border-b border-outline-variant pb-sm">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-container text-primary font-label-md text-label-md">2</span>
<h2 class="font-headline-md text-headline-md text-primary">Contact du Directeur</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="directorName">Nom complet</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow" id="directorName" name="directorName" placeholder="Ex: Jean Mukendi" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="directorPhone">Téléphone</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow" id="directorPhone" name="directorPhone" placeholder="+243 000 000 000" type="tel"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="directorEmail">Email professionnel</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow" id="directorEmail" name="directorEmail" placeholder="direction@ecole.cd" type="email"/>
</div>
</div>
</section>
<!-- Step 3: Pricing Plans -->
<section>
<div class="flex items-center gap-sm mb-lg border-b border-outline-variant pb-sm">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-container text-primary font-label-md text-label-md">3</span>
<h2 class="font-headline-md text-headline-md text-primary">Choisissez votre forfait</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-md">
<!-- Card 1 -->
<label class="plan-card relative flex flex-col p-lg border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low">
<input checked="" class="peer sr-only" name="plan" type="radio" value="decouverte"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="flex justify-between items-start mb-md">
<div>
<h3 class="font-headline-md text-headline-md text-primary">Découverte</h3>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit">Jusqu'à 150 élèves</p>
</div>
<span class="material-symbols-outlined text-outline peer-checked:text-primary peer-checked:font-variation-settings-'FILL'-1" data-icon="check_circle">check_circle</span>
</div>
<div class="mt-auto pt-md">
<span class="font-display-lg text-display-lg text-primary">49$</span>
<span class="font-body-md text-body-md text-on-surface-variant">/mois</span>
</div>
</label>
<!-- Card 2 -->
<label class="plan-card relative flex flex-col p-lg border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low">
<input class="peer sr-only" name="plan" type="radio" value="standard"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-secondary-container text-on-secondary-container font-label-md text-label-md px-sm py-xs rounded-full">Populaire</div>
<div class="flex justify-between items-start mb-md mt-sm">
<div>
<h3 class="font-headline-md text-headline-md text-primary">Standard</h3>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit">151 à 500 élèves</p>
</div>
<span class="material-symbols-outlined text-outline peer-checked:text-primary peer-checked:font-variation-settings-'FILL'-1" data-icon="check_circle">check_circle</span>
</div>
<div class="mt-auto pt-md">
<span class="font-display-lg text-display-lg text-primary">99$</span>
<span class="font-body-md text-body-md text-on-surface-variant">/mois</span>
</div>
</label>
<!-- Card 3 -->
<label class="plan-card relative flex flex-col p-lg border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low">
<input class="peer sr-only" name="plan" type="radio" value="pro"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="flex justify-between items-start mb-md">
<div>
<h3 class="font-headline-md text-headline-md text-primary">Pro</h3>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit">501 à 1000 élèves</p>
</div>
<span class="material-symbols-outlined text-outline peer-checked:text-primary peer-checked:font-variation-settings-'FILL'-1" data-icon="check_circle">check_circle</span>
</div>
<div class="mt-auto pt-md">
<span class="font-display-lg text-display-lg text-primary">179$</span>
<span class="font-body-md text-body-md text-on-surface-variant">/mois</span>
</div>
</label>
<!-- Card 4 -->
<label class="plan-card relative flex flex-col p-lg border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low">
<input class="peer sr-only" name="plan" type="radio" value="etablissement"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="flex justify-between items-start mb-md">
<div>
<h3 class="font-headline-md text-headline-md text-primary">Établissement</h3>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit">Plus de 1000 élèves</p>
</div>
<span class="material-symbols-outlined text-outline peer-checked:text-primary peer-checked:font-variation-settings-'FILL'-1" data-icon="check_circle">check_circle</span>
</div>
<div class="mt-auto pt-md">
<span class="font-headline-md text-headline-md text-primary block mb-unit">Sur devis</span>
<span class="font-body-md text-body-md text-on-surface-variant">Contactez-nous</span>
</div>
</label>
</div>
</section>
<!-- CTA -->
<div class="flex justify-end pt-lg border-t border-outline-variant">
<button class="bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md py-md px-xl rounded-lg transition-colors flex items-center gap-sm shadow-sm hover:shadow-md" type="submit">
                    Créer mon compte école
                    <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</main>
<script>
        document.querySelectorAll('input[name="plan"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('.plan-card').forEach(card => card.classList.remove('bg-surface-container-low'));
                if(e.target.checked) {
                    e.target.closest('.plan-card').classList.add('bg-surface-container-low');
                }
            });
        });
    </script>
</body></html>
